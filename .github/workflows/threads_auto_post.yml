name: Threads Auto Post

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 1 * * *'
    - cron: '0 4 * * *'
    - cron: '0 8 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Post to Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          sed -i "s/THREADS_ACCESS_TOKEN/$THREADS_ACCESS_TOKEN/" post_to_threads.py
          python post_to_threads.py
